<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Access</title>
    <!-- Premium Bold Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling & Smooth Transitions */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #000000;
            /* Light circles in background to make the glass blur look realistic */
            background-image: 
                radial-gradient(circle at 20% 20%, #1a1a1a 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, #111111 0%, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 1. Visible Premium Logo */
        header {
            position: absolute;
            top: 40px;
            z-index: 10;
        }

        .logo-box {
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid #ffffff;
            padding: 8px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* 2. iOS 26 Glassmorphism Main Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .glass-card h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .glass-card p.tagline {
            font-size: 14px;
            color: #888888;
            margin-bottom: 35px;
            font-weight: 700;
        }

        /* 3. iOS Style Selection Tab Bar */
        .tab-container {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px;
            border-radius: 16px;
            margin-bottom: 35px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            z-index: 2;
            color: #888888;
            transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.4;
        }

        .tab-btn span {
            display: block;
            font-weight: 900;
            font-size: 16px;
        }

        .tab-btn.active {
            color: #000000;
        }

        /* Sliding Background Logic */
        .tab-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: #ffffff;
            border-radius: 12px;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* 4. Bold Aesthetic Buy Now Button */
        .btn-action {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-action:hover {
            background: #e5e5e5;
            transform: scale(1.01);
        }

        .btn-action:active {
            transform: scale(0.99);
        }

        /* 5. Sleek Pop-up Payment Screen */
        .payment-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .payment-screen.open {
            opacity: 1;
            pointer-events: auto;
        }

        .payment-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        .payment-screen.open .payment-box {
            transform: scale(1);
        }

        .payment-box h2 {
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .payment-box p {
            color: #888888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .total-amount {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 30px;
            color: #ffffff;
        }

        /* Payment Buttons (UPI / Cards) */
        .pay-option {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pay-option:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-cancel {
            background: transparent;
            color: #888888;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Logo Section -->
    <header>
        <div class="logo-box">LOGO</div>
    </header>

    <!-- Main Dynamic Glass Card -->
    <div class="glass-card">
        <h1>CHOOSE PLAN</h1>
        <p class="tagline">Unlock Full Premium Experience</p>

        <!-- Custom iOS 26 Tab Selector -->
        <div class="tab-container">
            <div class="tab-slider" id="tabSlider"></div>
            <div class="tab-btn active" onclick="switchPlan('month', 0)">
                One Month <span>₹300</span>
            </div>
            <div class="tab-btn" onclick="switchPlan('season', 1)">
                Full Season <span>₹499</span>
            </div>
        </div>

        <!-- Sleek Buy Button -->
        <button class="btn-action" onclick="togglePayment(true)">Buy Now</button>
    </div>

    <!-- Hidden Smooth Payment Screen Overlay -->
    <div class="payment-screen" id="paymentOverlay">
        <div class="payment-box">
            <h2>Secure Checkout</h2>
            <p>You are paying for the selected plan</p>
            
            <!-- Dynamic Price Update Display -->
            <div class="total-amount" id="checkoutPrice">₹300</div>
            
            <!-- Gateway Triggers -->
            <div class="pay-option" onclick="alert('Redirecting to Google Pay / PhonePe...')">Pay via UPI Apps</div>
            <div class="pay-option" onclick="alert('Opening Secure Card Gateway...')">Credit / Debit Card</div>
            
            <button class="btn-cancel" onclick="togglePayment(false)">Cancel & Go Back</button>
        </div>
    </div>

    <!-- Interface Animations & Logic Script -->
    <script>
        let currentSelectedPrice = "₹300";

        // Tab Bar Switching Animation Logic
        function switchPlan(type, index) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => tab.classList.remove('active'));
            tabs[index].classList.add('active');

            const slider = document.getElementById('tabSlider');
            if (index === 0) {
                slider.style.transform = 'translateX(0%)';
                currentSelectedPrice = "₹300";
            } else {
                slider.style.transform = 'translateX(100%)';
                currentSelectedPrice = "₹499";
            }
        }

        // Open/Close Payment Sheet Animation
        function togglePayment(status) {
            const overlay = document.getElementById('paymentOverlay');
            if (status) {
                document.getElementById('checkoutPrice').innerText = currentSelectedPrice;
                overlay.classList.add('open');
            } else {
                overlay.classList.remove('open');
            }
        }
    </script>
</body>
</html>
