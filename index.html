<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXU GAMING</title>
    <style>
        :root {
            --bg-main: #0a0b10;
            --bg-card: #141622;
            --primary-glow: #00ffcc;
            --secondary-glow: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --success-color: #00ff66;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--primary-glow);
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
        }
        body::before { top: 10%; left: 10%; background: var(--secondary-glow); }
        body::after { bottom: 10%; right: 10%; }

        .view-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            width: 100%;
            max-width: 480px;
        }

        .view-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .game-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px rgba(157, 78, 221, 0.05);
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow));
        }

        .logo-container {
            margin-bottom: 25px;
        }
        
        /* Styled Logo Image Design */
        .site-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--secondary-glow);
            box-shadow: 0 0 20px var(--secondary-glow);
            transition: transform 0.3s ease;
        }

        .site-logo:hover {
            transform: scale(1.05);
        }

        .product-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .price-tag {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-glow);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .btn {
            background: linear-gradient(90deg, var(--secondary-glow), #b5179e);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
            filter: brightness(1.1);
        }

        .timer-box {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff3366;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .qr-placeholder {
            width: 200px;
            height: 200px;
            background: #fff;
            margin: 0 auto 25px auto;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            background: #1a1d2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 255, 102, 0.1);
            border: 2px solid var(--success-color);
            color: var(--success-color);
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .btn-telegram {
            background: linear-gradient(90deg, #0088cc, #24a1de);
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }

        .redirect-notice {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <section id="view-home" class="view-section active">
        <div class="game-card">
            <!-- Appended Logo Image Tag here -->
            <div class="logo-container">
                <img src="logo.png" alt="AXU GAMING" class="site-logo">
            </div>
            <h1 class="product-title" id="display-title">AXU 4.4 PAID FILE </h1>
            <p class="product-desc" id="display-desc">Get instant access to private servers, premium mods, and exclusive rewards.</p>
            <div class="price-tag" id="display-price">₹499</div>
            <button class="btn" onclick="navigateTo('view-payment'); startTimer();">Buy Now</button>
        </div>
    </section>

    <section id="view-payment" class="view-section">
        <div class="game-card">
            <div class="timer-box" id="timer">05:00</div>
            <h3>Complete Payment</h3>
            <p class="product-desc" style="margin-bottom: 15px;">Scan QR code using GPay, PhonePe or Paytm to pay.</p>
            
            <div class="qr-placeholder">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi%3A%2F%2Fpay%3Fpa%3Dikram.5%40superyes%26pn%3DAXUGAMING" alt="UPI QR Code" style="width: 100%; height: 100%; object-fit: contain;">
            </div>

            <div class="input-group">
                <label for="utr-input">UTR / Transaction ID</label>
                <input type="text" id="utr-input" class="input-field" placeholder="Enter 12-digit transaction ID">
            </div>
            <button class="btn" onclick="submitPayment()">Submit Transaction</button>
        </div>
    </section>

    <section id="view-success" class="view-section">
        <div class="game-card">
            <div class="success-icon">✓</div>
            <h1 class="product-title" style="background: linear-gradient(90deg, #00ff66, #00ffcc); -webkit-background-clip: text;">Success!</h1>
            <p class="product-desc">Your transaction has been submitted.</p>
            <a href="#" id="telegram-link" target="_blank" class="btn btn-telegram">Join Telegram</a>
            <p class="redirect-notice" id="redirect-text">Redirecting in 5 seconds...</p>
        </div>
    </section>

    <script>
        const CONFIG = {
            productTitle: "AXU GAMING 4.4 PAID FILE ",         
            productPrice: "₹499",                        
            productDescription: "PAYMENT WILL GET REFUND IN 15 TO 30 MINS SO DONT WARRY AND DONT TAKE STRESS.", 
            telegramURL: "https://t.me/+jKHplpoVI9YzNzg1", 
            countdownMinutes: 5,                          
            autoRedirectDelaySeconds: 5                   
        };

        document.getElementById('display-title').innerText = CONFIG.productTitle;
        document.getElementById('display-price').innerText = CONFIG.productPrice;
        document.getElementById('display-desc').innerText = CONFIG.productDescription;
        document.getElementById('telegram-link').href = CONFIG.telegramURL;

        let timerInterval;

        function navigateTo(viewId) {
            document.querySelectorAll('.view-section').forEach(view => {
                view.classList.remove('active');
            });
            setTimeout(() => {
                const targetView = document.getElementById(viewId);
                if (targetView) targetView.classList.add('active');
            }, 50);
        }

        function startTimer() {
            clearInterval(timerInterval);
            let timeRemaining = CONFIG.countdownMinutes * 60;
            const timerElement = document.getElementById('timer');

            function updateTimerDisplay() {
                let minutes = Math.floor(timeRemaining / 60);
                let seconds = timeRemaining % 60;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                timerElement.innerText = `${minutes}:${seconds}`;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Expired!");
                    navigateTo('view-home');
                }
                timeRemaining--;
            }
            updateTimerDisplay();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }

        function submitPayment() {
            const utrInput = document.getElementById('utr-input').value.trim();
            if (!utrInput) {
                alert("Please enter Transaction ID / UTR.");
                return;
            }
            clearInterval(timerInterval);
            navigateTo('view-success');
            startAutoRedirect();
        }

        function startAutoRedirect() {
            let countdown = CONFIG.autoRedirectDelaySeconds;
            const textElement = document.getElementById('redirect-text');
            const redirectInterval = setInterval(() => {
                countdown--;
                if(textElement) textElement.innerText = `Redirecting to Telegram in ${countdown} seconds...`;
                if (countdown <= 0) {
                    clearInterval(redirectInterval);
                    window.location.href = CONFIG.telegramURL;
                }
            }, 1000);
        }
    </script>
</body>
</html>
