<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AXU GAMING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <style>

    /* ─────────────────────────────────────────
       RESET
    ───────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0a0a; color: #fff;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─────────────────────────────────────────
       BACKGROUND
    ───────────────────────────────────────── */
    .bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 55% at 50% -5%,
          rgba(255,255,255,0.045) 0%, transparent 100%),
        radial-gradient(ellipse 60% 40% at 50% 105%,
          rgba(255,255,255,0.018) 0%, transparent 100%),
        #0a0a0a;
    }

    /* Subtle dot-grid */
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 75% 65% at 50% 30%,
        #000 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 30%,
        #000 0%, transparent 100%);
    }

    /* ─────────────────────────────────────────
       APP & SLIDE PAGES
    ───────────────────────────────────────── */
    .app {
      position: relative; z-index: 1;
      width: 100%; height: 100%; overflow: hidden;
    }

    .pages-wrap {
      display: flex; width: 200%; height: 100%;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pages-wrap.pg2 { transform: translateX(-50%); }

    .page {
      width: 50%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; overflow-y: auto; scrollbar-width: none;
    }
    .page::-webkit-scrollbar { display: none; }

    /* ─────────────────────────────────────────
       GLASS CARD
    ───────────────────────────────────────── */
    .card {
      width: 100%; max-width: 360px;
      background: rgba(255,255,255,0.057);
      backdrop-filter: blur(36px) saturate(1.5);
      -webkit-backdrop-filter: blur(36px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.105);
      border-radius: 28px;
      padding: 36px 28px 30px;
      position: relative;
      animation: card-in 0.65s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    /* Top specular highlight */
    .card::before {
      content: ''; position: absolute;
      top: 0; left: 18%; right: 18%; height: 1px;
      background: linear-gradient(90deg,
        transparent, rgba(255,255,255,0.24), transparent);
      border-radius: 50%;
    }

    /* Inner bottom edge shadow */
    .card::after {
      content: ''; position: absolute;
      bottom: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg,
        transparent, rgba(0,0,0,0.6), transparent);
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px) scale(0.975); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ═══════════════════════════════════════════
       PAGE 1 ── PLAN SELECTION
    ═══════════════════════════════════════════ */

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-name {
      font-family: 'Bebas Neue', cursive;
      font-size: 52px; letter-spacing: 9px; line-height: 1;
      color: #fff;
      text-shadow:
        0 0 40px rgba(255,255,255,0.07),
        0 1px 0 rgba(255,255,255,0.12);
      margin-bottom: 7px;
    }

    .brand-tag {
      font-size: 10px; letter-spacing: 4.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.27); font-weight: 400;
    }

    .field-label {
      font-size: 10px; letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.27); font-weight: 500;
      margin-bottom: 11px;
    }

    /* ── Plan Toggle ─────────────────────── */
    .plan-toggle {
      position: relative;
      background: rgba(255,255,255,0.038);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 17px; padding: 5px;
      margin-bottom: 26px;
    }

    .plan-pill {
      position: absolute; top: 5px; left: 5px;
      width: calc(50% - 5px); height: calc(100% - 10px);
      background: #ffffff; border-radius: 12px;
      box-shadow:
        0 2px 16px rgba(255,255,255,0.11),
        0 1px 0 rgba(255,255,255,0.25) inset;
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .plan-pill.right { transform: translateX(100%); }

    .plan-opts {
      display: grid; grid-template-columns: 1fr 1fr;
      position: relative; z-index: 1;
    }

    .plan-opt {
      padding: 14px 8px; text-align: center;
      cursor: pointer; user-select: none;
      -webkit-user-select: none;
    }
    .plan-opt:active { opacity: 0.75; }

    .opt-name {
      font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,0.48); margin-bottom: 3px;
      transition: color 0.32s ease;
    }
    .opt-price {
      font-family: 'Bebas Neue', cursive;
      font-size: 26px; letter-spacing: 2px;
      color: rgba(255,255,255,0.72);
      transition: color 0.32s ease;
    }
    .plan-opt.active .opt-name  { color: rgba(0,0,0,0.62); }
    .plan-opt.active .opt-price { color: #000; }

    /* ── Next Button ─────────────────────── */
    .btn {
      width: 100%; padding: 16.5px;
      border: none; border-radius: 15px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 600;
      letter-spacing: 2.5px; text-transform: uppercase;
      cursor: pointer; position: relative; overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-white {
      background: #fff; color: #000;
      box-shadow: 0 4px 22px rgba(255,255,255,0.09),
                  0 1px 0 rgba(255,255,255,0.3) inset;
    }
    .btn-white:active {
      transform: scale(0.97);
      box-shadow: 0 2px 10px rgba(255,255,255,0.06);
    }

    /* Shimmer sweep */
    .btn-white::after {
      content: ''; position: absolute;
      top: 0; width: 45%; height: 100%; left: -55%;
      background: linear-gradient(90deg,
        transparent, rgba(255,255,255,0.35), transparent);
      transform: skewX(-15deg);
      animation: shimmer 3s ease 1.5s infinite;
    }
    @keyframes shimmer {
      0%   { left: -55%; }
      45%, 100% { left: 150%; }
    }

    /* Disabled state */
    .btn-white:disabled, .btn-white[disabled] {
      opacity: 0.25; pointer-events: none;
    }
    .btn-white.dim { opacity: 0.26; pointer-events: none; }
    .btn-white.dim::after { display: none; }

    /* ═══════════════════════════════════════════
       PAGE 2 ── PAYMENT
    ═══════════════════════════════════════════ */

    .p2-head {
      display: flex; align-items: center;
      margin-bottom: 18px; position: relative;
      min-height: 34px;
    }

    .back-btn {
      width: 34px; height: 34px; flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .back-btn:active { background: rgba(255,255,255,0.13); }
    .back-btn svg {
      width: 14px; height: 14px; fill: none;
      stroke: rgba(255,255,255,0.52);
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    .p2-label {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-size: 10px; letter-spacing: 3.5px;
      text-transform: uppercase; color: rgba(255,255,255,0.27);
      white-space: nowrap;
    }

    /* Plan Row */
    .plan-row {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.038);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 13px; padding: 12px 17px;
      margin-bottom: 18px;
    }
    .row-name {
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.53); letter-spacing: 0.2px;
    }
    .row-price {
      font-family: 'Bebas Neue', cursive;
      font-size: 23px; letter-spacing: 2px; color: #fff;
    }

    /* QR Section */
    .qr-section {
      display: flex; flex-direction: column;
      align-items: center; gap: 11px; margin-bottom: 18px;
    }

    .qr-box {
      width: 158px; height: 158px;
      background: #fff; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      box-shadow:
        0 6px 30px rgba(255,255,255,0.08),
        0 1px 0 rgba(255,255,255,0.25) inset;
      position: relative;
    }

    /* Corner accents */
    .qr-corner {
      position: absolute; width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.12);
    }
    .qr-corner.tl { top: 7px; left: 7px; border-right: 0; border-bottom: 0; border-radius: 4px 0 0 0; }
    .qr-corner.tr { top: 7px; right: 7px; border-left: 0; border-bottom: 0; border-radius: 0 4px 0 0; }
    .qr-corner.bl { bottom: 7px; left: 7px; border-right: 0; border-top: 0; border-radius: 0 0 0 4px; }
    .qr-corner.br { bottom: 7px; right: 7px; border-left: 0; border-top: 0; border-radius: 0 0 4px 0; }

    .qr-box img {
      width: 100%; height: 100%;
      object-fit: contain; padding: 11px;
    }

    .qr-hint {
      font-size: 12px; color: rgba(255,255,255,0.32);
      text-align: center; line-height: 1.6;
    }

    /* UTR Input */
    .utr-input {
      width: 100%; padding: 14.5px 17px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 13px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: #fff;
      outline: none; caret-color: #fff;
      transition: border-color 0.25s ease, background 0.25s ease;
      margin-bottom: 12px;
    }
    .utr-input::placeholder { color: rgba(255,255,255,0.19); }
    .utr-input:focus {
      border-color: rgba(255,255,255,0.27);
      background: rgba(255,255,255,0.07);
    }

    /* Pay Button states handled via .dim class above */

    /* ═══════════════════════════════════════════
       SUCCESS OVERLAY
    ═══════════════════════════════════════════ */
    .s-overlay {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease;
    }
    .s-overlay.show { opacity: 1; pointer-events: auto; }

    /* SVG Circle + Check */
    .check-ring { width: 92px; height: 92px; margin-bottom: 28px; }

    .ring-bg {
      fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 1.5;
    }
    .ring-prog {
      fill: none; stroke: #fff; stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 245;
      stroke-dashoffset: 245;
      transition: none;
    }
    .check-mark {
      fill: none; stroke: #fff; stroke-width: 2.5;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 55; stroke-dashoffset: 55;
    }

    /* Animations triggered by .show */
    .s-overlay.show .ring-prog {
      animation: draw-ring 0.85s cubic-bezier(0.4,0,0.2,1) 0.15s forwards;
    }
    .s-overlay.show .check-mark {
      animation: draw-check 0.38s ease 0.88s forwards;
    }

    @keyframes draw-ring  { to { stroke-dashoffset: 0; } }
    @keyframes draw-check { to { stroke-dashoffset: 0; } }

    .s-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 36px; letter-spacing: 5px; color: #fff;
      margin-bottom: 7px; opacity: 0;
    }
    .s-sub {
      font-size: 13px; color: rgba(255,255,255,0.36);
      margin-bottom: 40px; opacity: 0;
    }

    .s-overlay.show .s-title { animation: rise 0.5s ease 0.95s both; }
    .s-overlay.show .s-sub   { animation: rise 0.5s ease 1.1s both;  }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* Progress bar */
    .prog-track {
      width: 170px; height: 1.5px;
      background: rgba(255,255,255,0.1); border-radius: 2px;
      overflow: hidden; opacity: 0;
    }
    .prog-fill {
      height: 100%; width: 0; background: #fff; border-radius: 2px;
    }
    .prog-fill.go { width: 100%; transition: width 3s linear; }

    .prog-label {
      font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.18); margin-top: 10px; opacity: 0;
    }

    .s-overlay.show .prog-track { animation: rise 0.4s ease 1.25s both; }
    .s-overlay.show .prog-label { animation: rise 0.4s ease 1.35s both; }

  </style>
</head>
<body>

<div class="bg"></div>

<div class="app">
  <div class="pages-wrap" id="pw">

    <!-- ════════════════════════════
         PAGE 1 — PLAN SELECTION
    ════════════════════════════ -->
    <div class="page">
      <div class="card">

        <div class="brand">
          <div class="brand-name">AXU REFUND AUTOMATON</div>
          <div class="brand-tag">Paid file amount refund in 15 minutes</div>
        </div>

        <div class="field-label">Select Your Plan</div>

        <div class="plan-toggle">
          <div class="plan-pill" id="pill"></div>
          <div class="plan-opts">
            <div class="plan-opt active" id="po0" onclick="pickPlan(0)">
              <div class="opt-name"  id="pn0">One Month</div>
              <div class="opt-price" id="pp0">₹300</div>
            </div>
            <div class="plan-opt" id="po1" onclick="pickPlan(1)">
              <div class="opt-name"  id="pn1">Full Season</div>
              <div class="opt-price" id="pp1">₹499</div>
            </div>
          </div>
        </div>

        <button class="btn btn-white" onclick="toPayment()">
          Next &nbsp;→
        </button>

      </div>
    </div>

    <!-- ════════════════════════════
         PAGE 2 — PAYMENT
    ════════════════════════════ -->
    <div class="page">
      <div class="card">

        <div class="p2-head">
          <div class="back-btn" onclick="toPlans()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          </div>
          <div class="p2-label">Complete Payment</div>
        </div>

        <div class="plan-row">
          <span class="row-name"  id="dn">One Month</span>
          <span class="row-price" id="dp">₹300</span>
        </div>

        <div class="qr-section">
          <div class="qr-box">
            <div class="qr-corner tl"></div>
            <div class="qr-corner tr"></div>
            <div class="qr-corner bl"></div>
            <div class="qr-corner br"></div>
            <img id="qrImg" src="" alt="Payment QR Code">
          </div>
          <div class="qr-hint">Scan the QR code and<br>complete your payment</div>
        </div>

        <input
          class="utr-input" id="utrInput"
          type="text" autocomplete="off" spellcheck="false"
          placeholder="Enter your UTR / Transaction ID"
          oninput="onUtrChange()">

        <button class="btn btn-white dim" id="payBtn" onclick="onPaid()">
          I Have Paid
        </button>

      </div>
    </div>

  </div>
</div>


<!-- ════════════════════════════
     SUCCESS OVERLAY
════════════════════════════ -->
<div class="s-overlay" id="sOverlay">

  <svg class="check-ring" viewBox="0 0 92 92">
    <!-- Track circle -->
    <circle class="ring-bg" cx="46" cy="46" r="39"/>
    <!-- Animated progress circle (starts drawing from top) -->
    <circle class="ring-prog" cx="46" cy="46" r="39"
            transform="rotate(-90 46 46)"/>
    <!-- Animated checkmark -->
    <polyline class="check-mark" points="29,47 41,59 64,33"/>
  </svg>

  <div class="s-title">Payment Sent</div>
  <div class="s-sub">Redirecting to Telegram…</div>

  <div class="prog-track">
    <div class="prog-fill" id="progFill"></div>
  </div>
  <div class="prog-label">Please wait</div>

</div>


<script>
/* ============================================================
   ⚙️  SETTINGS — Edit everything here, nowhere else needed
   ============================================================ */
const CFG = {

  // 📌  Your Telegram group / channel invite link
  TELEGRAM_LINK: "https://t.me/+jKHplpoVI9YzNzg1",

  // 📌  Your payment QR code image URL
  //     Replace with a hosted image URL (e.g. your phone scanner QR)
  //     or a base64 data URI of the image.
  QR_IMAGE: "https://ibb.co/ZpJjttTB",
  

  // 📌  Plans — change name and price freely
  PLANS: [
    { name: "One Month",   price: "₹300" },
    { name: "Full Season", price: "₹499" }
  ]

};
/* ============================================================ */


/* ── State ──────────────────────────────────────────── */
let activePlan = 0;

/* ── Init ───────────────────────────────────────────── */
(function init() {
  // Populate plan UI from config
  CFG.PLANS.forEach((p, i) => {
    document.getElementById('pn' + i).textContent = p.name;
    document.getElementById('pp' + i).textContent = p.price;
  });
  // Set QR image
  document.getElementById('qrImg').src = CFG.QR_IMAGE;
})();


/* ── Plan Selection ─────────────────────────────────── */
function pickPlan(i) {
  activePlan = i;

  // Slide the white pill
  document.getElementById('pill').classList.toggle('right', i === 1);

  // Toggle active text colors
  document.getElementById('po0').classList.toggle('active', i === 0);
  document.getElementById('po1').classList.toggle('active', i === 1);
}


/* ── Navigation ─────────────────────────────────────── */
function toPayment() {
  // Mirror selected plan onto payment page
  const p = CFG.PLANS[activePlan];
  document.getElementById('dn').textContent = p.name;
  document.getElementById('dp').textContent = p.price;

  // Reset form
  document.getElementById('utrInput').value = '';
  document.getElementById('payBtn').classList.add('dim');

  // Slide to page 2
  document.getElementById('pw').classList.add('pg2');
}

function toPlans() {
  document.getElementById('pw').classList.remove('pg2');
}


/* ── UTR Validation ─────────────────────────────────── */
function onUtrChange() {
  const hasText = document.getElementById('utrInput').value.trim().length > 0;
  document.getElementById('payBtn').classList.toggle('dim', !hasText);
}


/* ── Payment Submission ─────────────────────────────── */
function onPaid() {
  // Guard: button must be active
  if (document.getElementById('payBtn').classList.contains('dim')) return;

  // Show success overlay
  const overlay = document.getElementById('sOverlay');
  overlay.classList.add('show');

  // Start progress bar (after overlay animations settle)
  setTimeout(function() {
    document.getElementById('progFill').classList.add('go');
  }, 300);

  // Redirect to Telegram
  setTimeout(function() {
    window.location.href = CFG.TELEGRAM_LINK;
  }, 3400);
}
</script>

</body>
</html>
